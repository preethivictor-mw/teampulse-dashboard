<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    TeamPulse | Team Performance
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


<header class="app-header">

  <div class="brand">

    <div class="brand-icon">
      TP
    </div>

    <div>

      <h1>
        TeamPulse
      </h1>

      <p>
        Team Performance
      </p>

    </div>

  </div>


  <a
    href="index.html"
    class="back-button"
  >
    ← Dashboard
  </a>

</header>


<main class="dashboard">


  <section class="welcome-section">

    <span class="eyebrow">
      TEAM PERFORMANCE
    </span>

    <h2>
      Performance Leaderboard
    </h2>

    <p>
      Efficiency and quality performance
      for October 2026.
    </p>

  </section>


  <section class="panel">

    <div class="table-container">

      <table>

        <thead>

          <tr>

            <th>No.</th>

            <th>Employee</th>

            <th>Efficiency</th>

            <th>Quality</th>

            <th>Performance</th>

          </tr>

        </thead>


        <tbody id="leaderboardBody">
        </tbody>

      </table>

    </div>

  </section>


</main>


<script src="data.js"></script>

<script src="performance.js"></script>


</body>

</html>
